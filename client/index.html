<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    try {
      const storedTheme = localStorage.getItem("theme");
      const theme = JSON.parse(storedTheme)
      if (theme === "light") document.documentElement.dataset.theme = "light"

    } catch (err) {
      console.log(err)
    }

  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mizan — Personal finance, in balance</title>
  <meta name="description"
    content="Upload your KFH bank and card statements. Mizan sorts every transaction, tracks your cards and loans, and plans the fastest way out of debt." />
  <meta name="theme-color" content="#0e0a16" />
  <meta name="application-name" content="Mizan" />
  <meta name="apple-mobile-web-app-title" content="Mizan" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="canonical" href="%VITE_SITE_URL%/" />

  <!-- Open Graph: link previews in WhatsApp, LinkedIn, iMessage, etc. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mizan" />
  <meta property="og:title" content="Mizan — Personal finance, in balance" />
  <meta property="og:description"
    content="Upload your bank and card statements. See where your money goes, and plan your way out of debt." />
  <meta property="og:url" content="%VITE_SITE_URL%/" />
  <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Mizan: Your money, in balance." />

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mizan — Personal finance, in balance" />
  <meta name="twitter:description"
    content="Upload your bank and card statements. See where your money goes, and plan your way out of debt." />
  <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
